<!DOCTYPE html>
<html lang="en">
    <meta charset="utf-8" />
    <script type="module">
        import {define, Auth} from "@calpoly/mustang";
        import {RegisterFormElement } from "/src/auth/register-form";

        define({
            "mu-auth": Auth.Provider,
            "register-form": RegisterFormElement
        });
    </script>

    <body class="page">
        <mu-auth>
            <h2>New User</h2>
            <main class="card">
                <register-form api="/auth/register">
                    <label>
                        <span>Username:</span>
                        <input name="username" autocomplete="off" />
                    </label>
                    <label>
                        <span>Password:</span>
                        <input name="password" type="password"/>
                    </label>
                </register-form>
            </main>
            <p>Or did you want to 
                <a href="login.html">Sign in as an existing user</a>?
            </p>
        </mu-auth>
    </body>
</html>
